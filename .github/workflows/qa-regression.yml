# QA Regression Bot — full stack smoke + auth/permissions/tenant checks.
# Status check name for branch protection: "QA Regression Bot"
# Manual: Actions → QA Regression Bot → Run workflow

name: QA Regression Bot

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
      - master
      - development
      - develop
      - "release/**"
      - "hotfix/**"
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: qa-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  QA_API_URL: http://localhost:5003
  QA_FRONTEND_URL: http://127.0.0.1:4173
  QA_EMAIL: admin@erp.com
  QA_PASSWORD: Admin123!

jobs:
  qa-regression:
    name: QA Regression Bot
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: zhin@2024
          POSTGRES_DB: dberpsaas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dberpsaas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: backend/src/global.json
          cache: true
          cache-dependency-path: backend/src/**/*.csproj

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify QA Bot entrypoint
        run: |
          test -f qa-bot/run.js
          node --check qa-bot/run.js

      - name: Restore & build backend
        working-directory: backend/src
        run: dotnet build ERP.API/ERP.API.csproj -c Release

      - name: EF database update
        working-directory: backend/src
        env:
          ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=dberpsaas;Username=postgres;Password=zhin@2024
        run: |
          dotnet ef database update \
            --project ERP.Infrastructure/ERP.Infrastructure.csproj \
            --startup-project ERP.API/ERP.API.csproj \
            --no-build

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Start API (background)
        working-directory: backend/src
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://0.0.0.0:5003
          ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=dberpsaas;Username=postgres;Password=zhin@2024
          ConnectionStrings__Redis: localhost:6379
          Redis__ConnectionString: localhost:6379
          Jwt__SecretKey: ci-qa-regression-jwt-secret-min-32-chars
          Development__SeedDemoTenant: "true"
        run: |
          dotnet run --project ERP.API/ERP.API.csproj -c Release --no-build &
          echo $! > /tmp/erp-api.pid
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5003/health/live >/dev/null; then
              echo "API ready"
              exit 0
            fi
            sleep 2
          done
          echo "API failed to become healthy"
          exit 1

      - name: Start frontend preview (background)
        working-directory: frontend
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 &
          echo $! > /tmp/erp-frontend.pid
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4173/ >/dev/null; then
              echo "Frontend ready"
              exit 0
            fi
            sleep 2
          done
          echo "Frontend failed to become reachable"
          exit 1

      - name: Run QA Regression Bot
        run: node qa-bot/run.js

      - name: Stop background processes
        if: always()
        run: |
          for f in /tmp/erp-api.pid /tmp/erp-frontend.pid; do
            if [ -f "$f" ]; then
              kill "$(cat "$f")" 2>/dev/null || true
            fi
          done

      - name: Upload regression reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qa-regression-reports
          path: |
            reports/regression.json
            reports/regression.md
          retention-days: 14
          if-no-files-found: warn

# HITO 1 — Build, test y despliegue opcional a Azure App Service
# Despliegue (job deploy-azure): definir variable de repo AZURE_WEBAPP_NAME y el secreto AZURE_WEBAPP_PUBLISH_PROFILE (XML del perfil).
# Si AZURE_WEBAPP_NAME no está definida, el job de despliegue no se ejecuta (evita fallos en forks sin Azure).

name: Build, Test & Deploy

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  build-test-publish:
    name: Backend — restore, test, publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET SDK (global.json)
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: backend/src/global.json
          cache: true
          cache-dependency-path: backend/src/**/*.csproj

      - name: Restore, test, publish API
        run: |
          dotnet test backend/src/ERP.slnx -c Release --verbosity minimal
          dotnet publish backend/src/ERP.API/ERP.API.csproj -c Release -o "${{ github.workspace }}/publish" --no-self-contained

      - name: Upload artifact (API)
        uses: actions/upload-artifact@v4
        with:
          name: erp-api
          path: publish/

  deploy-azure:
    name: Deploy — Azure Web App
    runs-on: ubuntu-latest
    needs: build-test-publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AZURE_WEBAPP_NAME != ''

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: erp-api
          path: publish

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish

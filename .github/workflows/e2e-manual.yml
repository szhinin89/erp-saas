# E2E full-stack manual — Postgres + API + Playwright preview.
# Disparo: Actions → E2E Manual → Run workflow

name: E2E Manual

permissions:
  contents: read

on:
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  e2e:
    name: Playwright E2E (full stack)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: dberpsaas
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dberpsaas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: backend/src/global.json
          cache: true
          cache-dependency-path: backend/src/**/*.csproj

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Restore & build API
        working-directory: backend/src
        run: dotnet build ERP.API/ERP.API.csproj -c Release

      - name: EF database update
        working-directory: backend/src
        env:
          ConnectionStrings__DefaultConnection: Host=localhost;Port=5435;Database=dberpsaas;Username=postgres;Password=ci_test_password
        run: |
          dotnet ef database update \
            --project ERP.Infrastructure/ERP.Infrastructure.csproj \
            --startup-project ERP.API/ERP.API.csproj \
            --no-build

      - name: Start API (background)
        working-directory: backend/src
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://0.0.0.0:5003
          ConnectionStrings__DefaultConnection: Host=localhost;Port=5435;Database=dberpsaas;Username=postgres;Password=ci_test_password
          ConnectionStrings__Redis: ""
          HealthChecks__EnableRedis: "false"
          Development__SeedDemoTenant: "true"
        run: |
          dotnet run --project ERP.API/ERP.API.csproj -c Release --no-build &
          echo $! > /tmp/erp-api.pid
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5003/health/live >/dev/null; then
              echo "API ready"
              exit 0
            fi
            sleep 2
          done
          echo "API failed to become healthy"
          exit 1

      - name: Frontend build & Playwright
        working-directory: frontend
        env:
          E2E_API_URL: http://localhost:5003
          E2E_BASE_URL: http://127.0.0.1:4173
          CI: "true"
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Stop API
        if: always()
        run: |
          if [ -f /tmp/erp-api.pid ]; then
            kill "$(cat /tmp/erp-api.pid)" 2>/dev/null || true
          fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

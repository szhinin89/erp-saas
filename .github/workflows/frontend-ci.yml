name: Frontend CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        working-directory: frontend
        run: npm ci
      - name: ESLint
        working-directory: frontend
        run: npm run lint
      - name: Platform Control Plane guard (hard-gate)
        working-directory: frontend
        run: npm run platform:guard
      - name: Upload Platform guard report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-guard-report
          path: docs/ci/PLATFORM_GUARD_REPORT.md
          if-no-files-found: error
      - name: Typecheck + production build
        working-directory: frontend
        run: npm run build
      - name: Pages wrapper rule (F-01 / PR-6)
        shell: pwsh
        run: ./scripts/ci/check-pages-wrapper-rule.ps1
      - name: Architecture guardrails (frontend chunk)
        shell: pwsh
        run: ./tools/architecture/check-architecture-guardrails.ps1 -FrontendChunkOnly
      - name: Install Playwright (Chromium + system deps)
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: E2E smoke (Playwright)
        working-directory: frontend
        run: npm run test:e2e

name: Backend CI

on:
  workflow_call:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  DOTNET_CLI_UI_LANGUAGE: en

jobs:
  plan:
    name: Backend test inventory
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.groups.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify grouping and reporting guards
        run: python -m unittest discover -s tools/ci -p "test_backend_tests.py" -v
      - name: Explicit test groups
        id: groups
        run: python tools/ci/backend_tests.py --matrix

  tests:
    name: Backend (${{ matrix.group }})
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET SDK (global.json)
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: backend/src/**/*.csproj
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Restore, build, verify inventory and test group
        run: python tools/ci/backend_tests.py --group ${{ matrix.group }}
      - name: Test outcomes and slowest tests
        if: always()
        run: python tools/ci/backend_tests.py --group ${{ matrix.group }} --report
      - name: Upload TRX, inventory, logs and timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-${{ matrix.group }}
          path: .local/backend-ci/${{ matrix.group }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

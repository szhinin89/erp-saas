name: Backend CI

on:
  workflow_call:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET SDK (global.json)
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: backend/src/global.json
          cache: true
          cache-dependency-path: backend/src/**/*.csproj
      - name: dotnet --info
        run: dotnet --info
      - name: Restore, build, test
        run: dotnet test backend/src/ERP.slnx -c Release --verbosity minimal
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Platform Control Plane guard (static + endpoints)
        working-directory: frontend
        run: npm ci && npm run platform:guard

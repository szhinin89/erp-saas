# SPA React (Vite) servida por Nginx + proxy /api hacia ERP.API dentro de la red Docker.
# Mismo patrón que el proxy de Vite en desarrollo (vite.config.ts): peticiones relativas
# /api/* van al backend, sin necesidad de configurar CORS.

server {
    listen 80;
    server_name _;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy a ERP.API (nombre del servicio Docker Compose "erp-api", ver docker-compose.localprod.yml).
    location /api/ {
        proxy_pass http://erp-api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fallback SPA: cualquier ruta no encontrada como archivo estático vuelve a index.html
    # para que el router de React (client-side) resuelva la navegación.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # nginx no hereda `add_header` del bloque `server` en una location que define el suyo
    # propio — por eso los headers de seguridad se repiten aquí explícitamente.
    location = /index.html {
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location ~* \.(js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}

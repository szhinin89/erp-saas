# SPA React (Vite) servida por Nginx — solo estáticos.
# El frontend consume el backend vía VITE_API_URL (build-time, ver frontend/.env*),
# no vía proxy interno: en despliegues separados (Coolify) frontend y backend son
# recursos distintos, sin DNS interno compartido para resolver el nombre del
# servicio backend. El proxy a ese nombre de servicio solo aplicaba en
# docker-compose.localprod.yml, donde ambos contenedores comparten red Docker —
# ese escenario sigue resolviendo por el nombre publicado en ese compose file,
# no por este nginx.conf.

server {
    listen 80;
    server_name _;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /usr/share/nginx/html;
    index index.html;

    # Fallback SPA: cualquier ruta no encontrada como archivo estático vuelve a index.html
    # para que el router de React (client-side) resuelva la navegación.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # nginx no hereda `add_header` del bloque `server` en una location que define el suyo
    # propio — por eso los headers de seguridad se repiten aquí explícitamente.
    location = /index.html {
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location ~* \.(js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}

# Despliegue local "production-like" — API + Frontend Dockerizados.
#
# NO declara servicios postgres/redis: se conecta a los contenedores YA EXISTENTES
# (postgreszh, erp-saas-redis) vía la red Docker externa erp-saas_default, creada por
# docker-compose.yml / infrastructure/docker/compose.base.yml.
#
# Uso (desde la raíz del repo):
#   docker compose -f docker-compose.localprod.yml --env-file .env.docker.local up -d --build
#
# Ver docs/DOCKER_LOCAL_PROD.md para el procedimiento completo.

name: erp-saas-localprod

services:
  erp-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: erp-api-localprod
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=${POSTGRES_HOST:-postgreszh};Port=${POSTGRES_PORT:-5432};Database=${POSTGRES_DB:-dberpsaas};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__Redis: "${REDIS_HOST:-erp-saas-redis}:${REDIS_PORT:-6379},abortConnect=false"
      Redis__ConnectionString: "${REDIS_HOST:-erp-saas-redis}:${REDIS_PORT:-6379},abortConnect=false"
      Jwt__SecretKey: ${JWT_SECRET_KEY}
      Cors__AllowedOrigins__0: "http://localhost:${FRONTEND_PORT:-8080}"
      # Persistente vía volumen nombrado erp-api-files (ver `volumes:` abajo) — sin esto,
      # LocalFileStorage cae a <workdir>/files (=/app/files), que vive en el filesystem
      # efímero del contenedor y se pierde en cada `--force-recreate`. Certificados P12,
      # XML firmados y RIDE generados dependen de que esta ruta sobreviva recreaciones.
      FileStorage__BasePath: /app/data/files
    ports:
      - "${API_PORT:-5003}:8080"
    networks:
      - erp-saas-existing
    volumes:
      - erp-api-files:/app/data/files
      # Serilog (appsettings.json) escribe en la ruta relativa logs/erp-.txt, que con
      # WORKDIR=/app del Dockerfile resuelve a /app/logs — sin volumen, el historial de
      # logs se pierde en cada recreación del contenedor (ERP-CORE-CLOSEOUT-10).
      - erp-api-logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  erp-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: erp-frontend-localprod
    restart: unless-stopped
    depends_on:
      # condition: service_healthy (no solo "started") — evita que nginx empiece a
      # proxyear /api/* mientras erp-api todavía está aplicando migraciones/bootstrap
      # (ERP-CORE-CLOSEOUT-10).
      erp-api:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks:
      - erp-saas-existing

networks:
  erp-saas-existing:
    name: erp-saas_default
    external: true

volumes:
  # Certificados P12, XML firmados/autorizados y RIDE (PDF) generados por erp-api.
  # Nombrado (no bind mount) para no depender de rutas del host — sobrevive a
  # `docker compose ... up -d --force-recreate erp-api`; solo se borra con `down -v`,
  # que este proyecto nunca ejecuta contra este compose (ver docs/DOCKER_LOCAL_PROD.md).
  erp-api-files:
  erp-api-logs:
